[project]
name = "cvd70k"
version = "0.1.0"
description = "Group-isolated cardiovascular label classification and controlled prevalence benchmark"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.6", "scikit-learn>=1.6", "pandas>=2.2", "numpy>=2.1", "matplotlib>=3.9", "scipy>=1.15", "xgboost>=3.0", "joblib>=1.4"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvd70k"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
