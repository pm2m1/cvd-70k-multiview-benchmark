name: checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: brew install libomp
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
