name: V3 verification
on: [push, pull_request]
jobs:
  v3:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: brew install libomp
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
      - run: uv sync --project configs/v3 --frozen
      - run: uv run --project configs/v3 ruff check .
      - run: uv run --project configs/v3 ruff format --check .
      - run: uv run --project configs/v3 pytest -q
